services:
  # --- Frontend (React) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Use a domain placeholder for production.
        # This will be accessed by the user's browser, so it must be public.
        - VITE_API_URL=${VITE_API_URL:-https://api.yourdomain.com}
    container_name: agent_forge_studio_frontend
    restart: unless-stopped
    # Expose for reverse proxy
    expose:
      - "80"
    networks:
      - npm_default

  # --- Backend (FastAPI) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agent_forge_studio_backend
    restart: unless-stopped
    # No direct port exposure. Reverse proxy only.
    expose:
      - "8000"
    networks:
      - npm_default
    # Volumes removed for production to ensure immutable images
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  # --- PostgreSQL Database ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent_forge_studio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_db}
      POSTGRES_USER: ${POSTGRES_USER:-agent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - npm_default
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_user} -d ${POSTGRES_DB:-agent_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- DbGate (Database Management UI) ---
  dbgate:
    image: dbgate/dbgate:latest
    container_name: agent_forge_studio_dbgate
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      CONNECTIONS: postgres
      LABEL_postgres: Agent Database
      SERVER_postgres: postgres
      USER_postgres: ${POSTGRES_USER:-agent_user}
      PASSWORD_postgres: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PORT_postgres: 5432
      DATABASE_postgres: ${POSTGRES_DB:-agent_db}
      ENGINE_postgres: postgres@dbgate-plugin-postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - npm_default

volumes:
  postgres_data:


networks:
  npm_default:
    external: true
